<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffd500"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="OAOA"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon-192.png"><title>OAOA · Biblioteca Digital</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#292929;background:#fff9dd}*{box-sizing:border-box}body{margin:0}header{background:#ffd500;padding:22px 20px;box-shadow:0 2px 14px #0001}.head{max-width:1050px;margin:auto;display:flex;gap:18px;align-items:center}.head img{height:90px;width:90px;object-fit:contain;border-radius:20px;background:#ffdf27}h1{font-size:clamp(1.5rem,4vw,2.5rem);margin:0}header p{margin:6px 0 0}main{max-width:1050px;margin:36px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.book{background:white;border:1px solid #eedf98;border-radius:18px;padding:12px;box-shadow:0 5px 16px #62480013;text-align:center}.cover{position:relative;aspect-ratio:3/4;background:#ffe45a;border-radius:11px;overflow:hidden;display:grid;place-items:center}.cover img{width:100%;height:100%;object-fit:contain}.fallback{font-weight:800;font-size:clamp(1.5rem,4vw,3rem);color:#5b4000}.fallback small{display:block;font-size:.8rem;font-weight:600}.veil{position:absolute;inset:0;background:#1818189c;display:grid;place-items:center;color:white;font-weight:900;letter-spacing:.06em;font-size:clamp(.7rem,2vw,1.1rem);padding:8px}.book h2{font-size:1rem;margin:12px 0 8px}.book button{border:0;border-radius:9px;background:#222;color:white;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;width:100%}.book button:disabled{background:#e8e8e8;color:#666;cursor:not-allowed}.note{font-size:.9rem;color:#675f49;margin-top:24px}dialog{border:0;border-radius:16px;width:min(96vw,1100px);height:min(92vh,900px);padding:0;overflow:hidden}dialog::backdrop{background:#0009}.viewerhead{display:flex;align-items:center;justify-content:space-between;background:#ffd500;padding:12px 18px}.viewerhead button{border:0;background:white;border-radius:8px;padding:8px 12px;cursor:pointer}iframe{width:100%;height:calc(100% - 55px);border:0}@media(max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.book{padding:8px}.head img{height:70px;width:70px}main{margin-top:22px}}
</style></head><body><header><div class="head"><img src="assets/mascota-recorte.png" alt="Mascota OAOA"><div><h1>OAOA · Biblioteca Digital</h1><p>Matemáticas de 1.º a 6.º de Primaria</p></div></div></header><main><div class="grid" id="grid"></div><p class="note">Las portadas originales se incorporarán cuando dispongamos de sus archivos. Los enlaces de los libros 1.º–3.º se configurarán en <code>libros.json</code>.</p></main><dialog id="viewer"><div class="viewerhead"><strong id="viewerTitle"></strong><button id="close">✕ Cerrar</button></div><iframe id="frame" title="Lector de libro digital"></iframe></dialog><script>
const grid=document.querySelector('#grid'),viewer=document.querySelector('#viewer'),frame=document.querySelector('#frame');
fetch('libros.json').then(r=>r.json()).then(books=>{books.forEach(b=>{const card=document.createElement('article');card.className='book';const cover=document.createElement('div');cover.className='cover';const fallback=document.createElement('div');fallback.className='fallback';fallback.textContent=b.curso+'º';const sm=document.createElement('small');sm.textContent='MATEMÁTICAS';fallback.append(sm);cover.append(fallback);if(b.portada){const img=document.createElement('img');img.alt='Portada de '+b.curso+'º de Primaria';img.src=b.portada;img.onload=()=>fallback.remove();img.onerror=()=>img.remove();cover.append(img)}if(!b.disponible){const veil=document.createElement('div');veil.className='veil';veil.textContent='PRÓXIMAMENTE';cover.append(veil)}const title=document.createElement('h2');title.textContent=b.curso+'º de Primaria';const btn=document.createElement('button');btn.textContent=b.disponible?(b.url?'Abrir libro':'Enlace pendiente'):'Próximamente';btn.disabled=!b.disponible||!b.url;btn.onclick=()=>{document.querySelector('#viewerTitle').textContent=title.textContent;frame.src=b.url;viewer.showModal()};card.append(cover,title,btn);grid.append(card)})}).catch(()=>{grid.textContent='No se ha podido cargar el catálogo.'});document.querySelector('#close').onclick=()=>viewer.close();viewer.onclose=()=>frame.src='';
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
